services:
  backend:
    env_file:
      - ../.env.test
    environment:
      - DATABASE_URL=postgresql://devsecops:devsecops@localhost:5433/devsecops_test
      - REDIS_URL=redis://localhost:6379/0
    volumes:
      - ../backend:/app/backend
      - ../storage/test:/app/backend/storage/test

  frontend:
    env_file:
      - ../.env.test

  celery_worker:
    env_file:
      - ../.env.test
    environment:
      - DATABASE_URL=postgresql://devsecops:devsecops@localhost:5433/devsecops_test
      - REDIS_URL=redis://localhost:6379/0

  postgres:
    env_file:
      - ../.env.test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-test:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    network_mode: host
    env_file:
      - ../.env.test
    environment:
      PYTHONPATH: /app/backend
      DATABASE_URL: postgresql://devsecops:devsecops@localhost:5433/devsecops_test
      REDIS_URL: redis://localhost:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../backend:/app/backend
      - ../tests:/app/backend/tests
      - ../storage/test:/app/backend/storage/test
    command: ["pytest", "-q", "tests"]

volumes:
  postgres_data:
