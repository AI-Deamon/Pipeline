services:
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    image: sentinel-jenkins:2.541.3
    container_name: jenkins
    network_mode: host
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-995}"
    environment:
      - JAVA_OPTS=-Djava.awt.headless=true -Xmx7g -Xms512m
      - JENKINS_ADMIN_ID=${JENKINS_ADMIN_ID:-admin}
      # No insecure default: this container has Docker-socket access and (with
      # network_mode: host) is reachable on every host interface, not just
      # localhost — a weak/default admin password here is a near-direct path to
      # root on the host via a pipeline step. Compose refuses to start rather than
      # silently falling back to admin123.
      - JENKINS_ADMIN_PASSWORD=${JENKINS_ADMIN_PASSWORD:?Set JENKINS_ADMIN_PASSWORD - no insecure default is allowed}
      - JENKINS_OPTS=${JENKINS_OPTS:-}
    restart: unless-stopped

volumes:
  jenkins_home:
    # Explicit name, not just the compose-project-prefixed default. Without
    # this, Compose silently resolves the mount below to "docker_jenkins_home"
    # (project name "docker" + this key) - a *different*, older, incomplete
    # volume that happened to already exist on this host - while every backup
    # restore in migrate.sh populates the plain "jenkins_home" volume by name.
    # The two never matched, so the container kept booting into stale/empty
    # state no matter how many times the restore ran correctly.
    name: jenkins_home
