server_tokens off;

server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Finding #83: no security headers previously — no CSP, clickjacking
    # protection, MIME-sniffing protection, or referrer control, and the
    # `Server: nginx/<version>` banner (suppressed above via server_tokens off)
    # was a free CVE-fingerprinting signal. script-src is strict (the app has no
    # inline scripts — Vite emits hashed external bundles only); style-src allows
    # 'unsafe-inline' because Tailwind/recharts rely on inline `style` attributes
    # at runtime. connect-src covers same-origin API/WebSocket traffic proxied
    # through this same nginx instance.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend on host network
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # WebSocket long-lived connection timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Deny access to dotfiles
    location ~ /\. {
        deny all;
    }
}
