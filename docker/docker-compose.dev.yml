services:
  backend:
    env_file:
      - ../.env.dev
    environment:
      - DATABASE_URL=postgresql://devsecops:devsecops@localhost:5433/devsecops_dev
      - REDIS_URL=redis://localhost:6379/0
      - JENKINS_BASE_URL=http://localhost:8080
    volumes:
      - ../backend:/app/backend
      - ../storage/dev:/app/backend/storage/dev

  celery_worker:
    env_file:
      - ../.env.dev
    environment:
      - DATABASE_URL=postgresql://devsecops:devsecops@localhost:5433/devsecops_dev
      - REDIS_URL=redis://localhost:6379/0
      - JENKINS_BASE_URL=http://localhost:8080
    volumes:
      - ../backend:/app/backend

  frontend:
    env_file:
      - ../.env.dev

  postgres:
    env_file:
      - ../.env.dev
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
