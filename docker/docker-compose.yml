services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    network_mode: host
    env_file:
      - ../.env.dev
    environment:
      - DATABASE_URL=postgresql://devsecops:staging-password@127.0.0.1:5433/devsecops_staging
      - REDIS_URL=redis://localhost:6380/0
      - JENKINS_BASE_URL=http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    # -B runs the beat scheduler embedded in this worker process (finding #16) — fires
    # celery_app.py's beat_schedule (cleanup_expired_reports, daily at 3 AM). Only
    # correct with a single worker replica; if this is ever scaled, move beat to its
    # own single-instance service instead, or the schedule fires once per replica.
    command: [ "celery", "-A", "app.core.celery_app.celery_app", "worker", "-B", "--loglevel=info" ]
    restart: unless-stopped
    network_mode: host
    env_file:
      - ../.env.dev
    environment:
      - DATABASE_URL=postgresql://devsecops:staging-password@127.0.0.1:5433/devsecops_staging
      - REDIS_URL=redis://localhost:6380/0
      - JENKINS_BASE_URL=http://localhost:8080
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    network_mode: host
    environment:
      VITE_API_KEY: z9y8x7w6v5u4t3s2r1q0p9o8n7m6l5k4
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ../.env.dev
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6380:6379"

  sonarqube:
    image: sonarqube:26.5.0.122743-community
    network_mode: host
    env_file:
      - ../.env.dev
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://localhost:5433/sonarqube
      - SONAR_JDBC_USERNAME=sonarqube
      - SONAR_JDBC_PASSWORD=sonarqube
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9000/api/system/status | grep -q UP || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  postgres_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
