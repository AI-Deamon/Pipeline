services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    network_mode: host
    env_file:
      - ../.env.dev
    environment:
      - DATABASE_URL=postgresql://devsecops:staging-password@127.0.0.1:5433/devsecops_staging
      - REDIS_URL=redis://localhost:6379/0
      - JENKINS_BASE_URL=http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    command: [ "celery", "-A", "app.core.celery_app.celery_app", "worker", "--loglevel=info" ]
    restart: unless-stopped
    network_mode: host
    env_file:
      - ../.env.dev
    environment:
      - DATABASE_URL=postgresql://devsecops:staging-password@127.0.0.1:5433/devsecops_staging
      - REDIS_URL=redis://localhost:6379/0
      - JENKINS_BASE_URL=http://localhost:8080
    depends_on:
      - redis
      - postgres

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    network_mode: host
    environment:
      VITE_API_KEY: z9y8x7w6v5u4t3s2r1q0p9o8n7m6l5k4
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ../.env.dev
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6380:6379"

volumes:
  postgres_data:
